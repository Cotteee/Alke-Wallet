<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Dinero</title>
   <!--CDN bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  div class="container">
  <div class="p-3 mb-2 bg-success-subtle text-success-emphasis">

    <h2>Enviar Dinero</h2>
    <p>Saldo disponible: $<span id="saldoSend">0</span></p>

    <!-- Botón para mostrar formulario -->
    <button id="btnAgregarContacto" class="btn btn-success mb-2">Agregar nuevo contacto</button>

    <!-- Formulario emergente -->
    <div id="formNuevoContacto" style="display:none;">
      <h3>Ingresar nuevo contacto:</h3>

      <input type="text" id="nombre" placeholder="Nombre y apellido" class="form-control mb-2">
      <input type="text" id="numeroCuenta" placeholder="Numero de Cuenta" class="form-control mb-2">
      <input type="text" id="alias" placeholder="Alias" class="form-control mb-2">
      <input type="text" id="banco" placeholder="Banco" class="form-control mb-2">

      <button id="btnGuardarContacto" class="btn btn-success mt-2">Guardar contacto</button>
      <button id="btnCancelarContacto" class="btn btn-danger mt-2">Cancelar</button>
    </div>
<!-- Contenedor de alertas -->
<div id="alert-container" class="mb-5"></div>

<!-- Campo de búsqueda -->
<div class="mb-3">
    <input type="text" id="busquedaContacto" class="form-control" placeholder="Buscar por nombre o alias">
    <datalist id="contactosDatalist"></datalist>
</div>

    <h2>Contactos</h2>
    <ul id="listaContactos" class="list-group mb-3"></ul>

    <input type="number" id="montoEnviar" placeholder="Monto a enviar" class="form-control mb-2">
    <p id="mensajeEnvio"></p>

    <button type="submit" id="btnEnviar" class="btn btn-success mt-2">Enviar dinero</button>
    <a href="menu.html" class="btn btn-secondary mt-2">Volver al Menú Principal</a>

  </div>
</div><!-- jQuery CDN (recomendado) --> <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> <!-- Popper (Bootstrap 4 lo necesita para algunos componentes) --> 
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script> 
<!-- Bootstrap 4 JS --> <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script> 
 <!-- Tu JavaScript --> <script src="assets/js/appsendmoney.js"></script> </body> </html>
</body>
</html>
