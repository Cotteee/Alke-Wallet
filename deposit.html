<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar</title>
     <!--CDN bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
 

    <div class="container">
         <div class="p-3 mb-2 bg-success-subtle text-success-emphasis">
            <!--Encabezado-->
        <h2>Depositar</h2>


        <!--Formulario-->
        <form id="formDeposit">
            <div class="form-group">
                <p>Saldo actual: $<span id="saldoActual">600000</span></p>
                <label for="depositAmount">Monto a depositar:</label>
                <input type="number" class="form-control mt-2" id="Monto" placeholder="Ingresar monto">    
            </div>
            <p id="mensajeDeposito" class="muted" ></p>
            <button type="submit" class="btn btn-success mt-3" id="btnDepositar" >Realizar depósito</button>            
        </form>

<div id="alert-container" class="mt-3"></div>
<div id="leyendaDeposito" class="mt-2"></div>


        <!--boton-->
        <a href="menu.html" class="btn btn-secondary mt-1">Volver al Menú Principal</a>
    </div>


  <!-- jQuery CDN (recomendado) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Popper (Bootstrap 4 lo necesita para algunos componentes) -->
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

  <!-- Bootstrap 4 JS -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>




 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>  
  <!-- Tu JavaScript -->
  <script src="assets/js/appdeposit.js"></script>


   
</body>
</html>
