<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Últimos Movimientos</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Estilo personalizado para tarjetas de movimientos */
    .movimiento-card {
      margin-bottom: 15px;
      border-left: 5px solid #198754; /* verde Bootstrap */
    }
    .movimiento-card.deposito { border-color: #0d6efd; }
    .movimiento-card.envio { border-color: #fd7e14; }
    .movimiento-card.compra { border-color: #dc3545; }
    .movimiento-card.recepcion { border-color: #6f42c1; }

    .movimiento-fecha {
      font-size: 0.8rem;
      color: gray;
    }
    .movimiento-monto {
      font-weight: bold;
    }

    /* Ajuste de select y contenedor */
    .filtro-container {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container my-4">

    <div class="p-3 mb-3 bg-success-subtle text-success-emphasis rounded">
      <h2 class="mb-3">Últimos Movimientos</h2>

      <!-- Filtro -->
      <div class="filtro-container">
        <label for="filtroTipo" class="form-label">Filtrar por tipo de movimiento:</label>
        <select id="filtroTipo" class="form-select">
          <option value="todos">Todos</option>
          <option value="compra">Compra</option>
          <option value="deposito">Depósito</option>
          <option value="Envío">Transferencia enviada</option>
          <option value="recepcion">Transferencia recibida</option>
        </select>
      </div>

      <!-- Lista de movimientos -->
      <div id="listaMovimientos" class="list-unstyled"></div>

      <!-- Botón volver -->
      <a href="menu.html" class="btn btn-secondary mt-3">Volver al Menú principal</a>
    </div>

  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/apptransactions.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
