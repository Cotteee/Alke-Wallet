<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesión</title>
    <!--CDN bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
       <div class="p-3 mb-2 bg-success-subtle text-success-emphasis">
        <!--Encabezado-->
        <h2>Inicio de sesión</h2>
       


       <!--FORMULARIO-->
        <form id="formlogin">
             <div class="mb-3">
    <label for="email" class="form-label">Email:</label>
    <input type="email" class="form-control" id="email" placeholder="Ingresar email" required>
 
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Contraseña:</label>
    <input type="password" class="form-control" id="password" placeholder="Ingresar contraseña" required>
       </div>
       
        
       <button type="button" id="btnlogin" class="btn btn-success ">Ingresar</button> 
       <div id="alertaLogin" class="mt-3"></div>
</div>
      
       
       
      </div>
       </form>
     


     
        
    </div>







 <!-- jQuery CDN (recomendado) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</body>
</html>
